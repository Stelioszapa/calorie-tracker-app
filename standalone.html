<!DOCTYPE html>
<html lang="el" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>NutriCal - Calorie & Macronutrient Tracker</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 700: '#047857'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .glass-panel { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-modal { background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(16px); }
  </style>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Local Storage Service ---
    const STORAGE_KEY_MEALS = 'nutrical_standalone_meals_v1';
    const STORAGE_KEY_PROFILES = 'nutrical_standalone_profiles_v1';
    const STORAGE_KEY_ACTIVE_P = 'nutrical_standalone_active_p_v1';

    const DEFAULT_PROFILES = [
      {
        id: 'profile_me',
        name: 'Στέλιος (21 ετών | 172 cm | 75 kg → 68 kg)',
        shortName: 'Στέλιος',
        target: 2000,
        targetProtein: 160,
        targetCarbs: 200,
        targetFat: 60,
        color: 'emerald'
      },
      {
        id: 'profile_her',
        name: 'Δήμητρα (21 ετών | 161 cm | 55 kg → 50 kg)',
        shortName: 'Δήμητρα',
        target: 1400,
        targetProtein: 100,
        targetCarbs: 140,
        targetFat: 42,
        color: 'pink'
      }
    ];

    const FOOD_PRESETS = [
      { name: 'Χωριάτικη Σαλάτα', category: 'lunch', quantity: '1 μερίδα (350g)', calories: 420, protein: 12, carbs: 18, fat: 34 },
      { name: 'Φρέντο Εσπρέσο (χωρίς ζάχαρη)', category: 'breakfast', quantity: '1 ποτήρι', calories: 5, protein: 0, carbs: 1, fat: 0 },
      { name: 'Φρέντο Μέτριο', category: 'breakfast', quantity: '1 ποτήρι', calories: 60, protein: 1, carbs: 14, fat: 0 },
      { name: 'Τοστ Γαλοπούλα & Τυρί', category: 'breakfast', quantity: '1 τεμάχιο', calories: 280, protein: 16, carbs: 32, fat: 10 },
      { name: 'Ομελέτα 3 Αυγά & Φέτα', category: 'breakfast', quantity: '1 πιάτο', calories: 380, protein: 24, carbs: 4, fat: 30 },
      { name: 'Σουβλάκι Κοτόπουλο Πίτα Απ\' όλα', category: 'dinner', quantity: '1 τεμάχιο', calories: 550, protein: 32, carbs: 48, fat: 22 },
      { name: 'Στήθος Κοτόπουλο με Ρύζι', category: 'lunch', quantity: '200g κοτόπουλο / 150g ρύζι', calories: 480, protein: 46, carbs: 50, fat: 8 },
      { name: 'Μπιφτέκια Μοσχαρίσια με Πατάτες', category: 'lunch', quantity: '2 μπιφτέκια & πατάτες', calories: 620, protein: 38, carbs: 45, fat: 30 },
      { name: 'Γιαούρτι 2% με Μέλι & Καρύδια', category: 'snack', quantity: '1 μπολ', calories: 240, protein: 14, carbs: 26, fat: 8 },
      { name: 'Μήλο & 10 Αμύγδαλα', category: 'snack', quantity: '1 μερίδα', calories: 160, protein: 4, carbs: 22, fat: 7 }
    ];

    function getProfiles() {
      try {
        const data = localStorage.getItem(STORAGE_KEY_PROFILES);
        if (data) {
          const parsed = JSON.parse(data);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        }
      } catch (e) {}
      localStorage.setItem(STORAGE_KEY_PROFILES, JSON.stringify(DEFAULT_PROFILES));
      return DEFAULT_PROFILES;
    }

    function saveProfiles(profiles) {
      localStorage.setItem(STORAGE_KEY_PROFILES, JSON.stringify(profiles));
    }

    function getActiveProfileId() {
      return localStorage.getItem(STORAGE_KEY_ACTIVE_P) || 'profile_me';
    }

    function setActiveProfileId(id) {
      localStorage.setItem(STORAGE_KEY_ACTIVE_P, id);
    }

    function getActiveProfile() {
      const profiles = getProfiles();
      const activeId = getActiveProfileId();
      return profiles.find(p => p.id === activeId) || profiles[0] || DEFAULT_PROFILES[0];
    }

    function getAllMeals() {
      try {
        const data = localStorage.getItem(STORAGE_KEY_MEALS);
        const all = data ? JSON.parse(data) : [];
        const activeId = getActiveProfileId();
        return all.filter(m => !m.profileId || m.profileId === activeId);
      } catch (e) {
        return [];
      }
    }

    function saveAllMeals(meals) {
      localStorage.setItem(STORAGE_KEY_MEALS, JSON.stringify(meals));
    }

    // --- App Component ---
    function App() {
      const getTodayStr = () => new Date().toISOString().split('T')[0];
      const [view, setView] = useState('daily');
      const [selectedDate, setSelectedDate] = useState(getTodayStr());
      const [profiles, setProfiles] = useState(getProfiles());
      const [activeProfile, setActiveProfileState] = useState(getActiveProfile());
      const [meals, setMeals] = useState([]);
      
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [editingMeal, setEditingMeal] = useState(null);

      // Form State
      const [foodName, setFoodName] = useState('');
      const [foodQty, setFoodQty] = useState('1 μερίδα');
      const [foodKcal, setFoodKcal] = useState('');
      const [foodProtein, setFoodProtein] = useState('');
      const [foodCarbs, setFoodCarbs] = useState('');
      const [foodFat, setFoodFat] = useState('');
      const [foodCat, setFoodCat] = useState('lunch');

      useEffect(() => {
        refreshMeals(selectedDate);
      }, [selectedDate, activeProfile]);

      const refreshState = () => {
        const allP = getProfiles();
        const curP = getActiveProfile();
        setProfiles(allP);
        setActiveProfileState(curP);
        refreshMeals(selectedDate);
      };

      const refreshMeals = (dateStr) => {
        const all = getAllMeals();
        setMeals(all.filter(m => m.date === dateStr));
      };

      const handleSaveMeal = (e) => {
        e.preventDefault();
        if (!foodName.trim() || !foodKcal) return;

        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY_MEALS) || '[]');
        const kcalNum = parseInt(foodKcal, 10) || 0;
        const pNum = parseInt(foodProtein, 10) || 0;
        const cNum = parseInt(foodCarbs, 10) || 0;
        const fNum = parseInt(foodFat, 10) || 0;
        const activeId = activeProfile.id;

        if (editingMeal) {
          const idx = raw.findIndex(m => m.id === editingMeal.id);
          if (idx !== -1) {
            raw[idx] = { 
              ...raw[idx], 
              name: foodName, 
              quantity: foodQty, 
              calories: kcalNum, 
              protein: pNum, 
              carbs: cNum, 
              fat: fNum, 
              category: foodCat 
            };
          }
        } else {
          raw.push({
            id: 'm_' + Date.now(),
            profileId: activeId,
            date: selectedDate,
            name: foodName,
            quantity: foodQty,
            calories: kcalNum,
            protein: pNum,
            carbs: cNum,
            fat: fNum,
            category: foodCat
          });

          const dayTotal = meals.reduce((s, m) => s + m.calories, 0) + kcalNum;
          if (selectedDate === getTodayStr() && dayTotal >= activeProfile.target * 0.9 && dayTotal <= activeProfile.target * 1.05) {
            confetti({ particleCount: 70, spread: 60 });
          }
        }

        saveAllMeals(raw);
        refreshMeals(selectedDate);
        setIsModalOpen(false);
        setEditingMeal(null);
      };

      const handleDeleteMeal = (id) => {
        if (confirm('Διαγραφή γεύματος;')) {
          const raw = JSON.parse(localStorage.getItem(STORAGE_KEY_MEALS) || '[]').filter(m => m.id !== id);
          saveAllMeals(raw);
          refreshMeals(selectedDate);
        }
      };

      const openAddModal = (meal = null) => {
        if (meal) {
          setEditingMeal(meal);
          setFoodName(meal.name);
          setFoodQty(meal.quantity);
          setFoodKcal(meal.calories.toString());
          setFoodProtein((meal.protein || 0).toString());
          setFoodCarbs((meal.carbs || 0).toString());
          setFoodFat((meal.fat || 0).toString());
          setFoodCat(meal.category);
        } else {
          setEditingMeal(null);
          setFoodName('');
          setFoodQty('1 μερίδα');
          setFoodKcal('');
          setFoodProtein('');
          setFoodCarbs('');
          setFoodFat('');
          setFoodCat('lunch');
        }
        setIsModalOpen(true);
      };

      const totalKcal = meals.reduce((sum, m) => sum + (m.calories || 0), 0);
      const totalProtein = meals.reduce((sum, m) => sum + (m.protein || 0), 0);
      const totalCarbs = meals.reduce((sum, m) => sum + (m.carbs || 0), 0);
      const totalFat = meals.reduce((sum, m) => sum + (m.fat || 0), 0);

      const remainingKcal = activeProfile.target - totalKcal;
      const progressPct = Math.min(100, Math.round((totalKcal / activeProfile.target) * 100));

      const pPct = Math.min(100, Math.round((totalProtein / (activeProfile.targetProtein || 150)) * 100));
      const cPct = Math.min(100, Math.round((totalCarbs / (activeProfile.targetCarbs || 200)) * 100));
      const fPct = Math.min(100, Math.round((totalFat / (activeProfile.targetFat || 60)) * 100));

      const isPink = activeProfile.color === 'pink' || activeProfile.id === 'profile_her';

      return (
        <div className="max-w-4xl mx-auto px-4 py-6">
          {/* Header */}
          <header className="glass-panel p-4 rounded-2xl flex items-center justify-between mb-6 border border-slate-800">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center font-black text-slate-950 text-xl">
                🔥
              </div>
              <div>
                <h1 className="text-xl font-bold bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">
                  NutriCal Standalone
                </h1>
                <p className="text-[11px] text-slate-400">Calorie & Macro Tracker</p>
              </div>
            </div>

            <div className="flex items-center space-x-2">
              <button
                onClick={() => setView('daily')}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${view === 'daily' ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-300'}`}
              >
                Ημέρα
              </button>
              <button
                onClick={() => setView('calendar')}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${view === 'calendar' ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-300'}`}
              >
                Ημερολόγιο
              </button>

              <button
                onClick={() => setIsSettingsOpen(true)}
                className={`flex items-center space-x-1 px-3 py-1.5 rounded-lg text-xs font-bold border transition ${
                  isPink ? 'bg-pink-500/20 text-pink-300 border-pink-500/40' : 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40'
                }`}
                title="Αλλαγή προφίλ στις ρυθμίσεις"
              >
                <span>{isPink ? '💖' : '👤'} {activeProfile.shortName || activeProfile.name}</span>
                <span className="text-[10px] text-slate-400 ml-1">⚙️</span>
              </button>
            </div>
          </header>

          {/* Daily View */}
          {view === 'daily' && (
            <div className="space-y-6">
              {/* Date Nav */}
              <div className="glass-panel p-3 rounded-2xl flex items-center justify-between">
                <button
                  onClick={() => {
                    const d = new Date(selectedDate);
                    d.setDate(d.getDate() - 1);
                    setSelectedDate(d.toISOString().split('T')[0]);
                  }}
                  className="px-3 py-1.5 bg-slate-800 rounded-xl text-xs font-bold"
                >
                  ◀ Προν.
                </button>
                <input
                  type="date"
                  value={selectedDate}
                  onChange={(e) => e.target.value && setSelectedDate(e.target.value)}
                  className="bg-transparent text-sm font-bold text-emerald-400 text-center cursor-pointer"
                />
                <button
                  onClick={() => {
                    const d = new Date(selectedDate);
                    d.setDate(d.getDate() + 1);
                    setSelectedDate(d.toISOString().split('T')[0]);
                  }}
                  className="px-3 py-1.5 bg-slate-800 rounded-xl text-xs font-bold"
                >
                  Επόμ. ▶
                </button>
              </div>

              {/* Progress & Macros Card */}
              <div className="bg-slate-950 p-6 rounded-3xl border border-slate-800 space-y-5">
                
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-baseline gap-2">
                  <div>
                    <div className="text-xs text-slate-400 mb-1">
                      Ενεργό Προφίλ: <strong className="text-white">{activeProfile.name}</strong>
                    </div>
                    <h2 className="text-3xl font-black text-white">{totalKcal.toLocaleString()} <span className="text-sm font-normal text-slate-400">/ {activeProfile.target} kcal</span></h2>
                  </div>
                  <div className={`px-3 py-1 rounded-full text-xs font-bold ${totalKcal > activeProfile.target ? 'bg-rose-500/20 text-rose-400' : 'bg-emerald-500/20 text-emerald-400'}`}>
                    {totalKcal > activeProfile.target ? '⚠️ Υπέρβαση' : '✅ Εντός Στόχου'}
                  </div>
                </div>

                <div className="h-3 w-full bg-slate-800 rounded-full overflow-hidden">
                  <div
                    className={`h-full transition-all duration-500 ${totalKcal > activeProfile.target ? 'bg-rose-500' : 'bg-emerald-500'}`}
                    style={{ width: `${progressPct}%` }}
                  />
                </div>

                {/* Macro Target Progress Bars */}
                <div className="grid grid-cols-3 gap-3 pt-2">
                  
                  {/* Protein */}
                  <div className="bg-slate-900 p-2.5 rounded-2xl border border-rose-500/20 space-y-1">
                    <div className="flex justify-between text-[11px]">
                      <span className="font-bold text-rose-400">🥩 Πρωτεΐνη</span>
                      <span className="font-extrabold text-white">{totalProtein}/{activeProfile.targetProtein || 150}g</span>
                    </div>
                    <div className="h-2 w-full bg-slate-950 rounded-full overflow-hidden">
                      <div className="h-full bg-rose-500 rounded-full" style={{ width: `${pPct}%` }} />
                    </div>
                  </div>

                  {/* Carbs */}
                  <div className="bg-slate-900 p-2.5 rounded-2xl border border-amber-500/20 space-y-1">
                    <div className="flex justify-between text-[11px]">
                      <span className="font-bold text-amber-400">🍞 Υδατάνθρ.</span>
                      <span className="font-extrabold text-white">{totalCarbs}/{activeProfile.targetCarbs || 200}g</span>
                    </div>
                    <div className="h-2 w-full bg-slate-950 rounded-full overflow-hidden">
                      <div className="h-full bg-amber-500 rounded-full" style={{ width: `${cPct}%` }} />
                    </div>
                  </div>

                  {/* Fat */}
                  <div className="bg-slate-900 p-2.5 rounded-2xl border border-cyan-500/20 space-y-1">
                    <div className="flex justify-between text-[11px]">
                      <span className="font-bold text-cyan-400">🥑 Λιπαρά</span>
                      <span className="font-extrabold text-white">{totalFat}/{activeProfile.targetFat || 60}g</span>
                    </div>
                    <div className="h-2 w-full bg-slate-950 rounded-full overflow-hidden">
                      <div className="h-full bg-cyan-500 rounded-full" style={{ width: `${fPct}%` }} />
                    </div>
                  </div>

                </div>

                <div className="flex justify-between items-center text-xs pt-2">
                  <span className="text-slate-400">Υπολειπόμενες: <strong className="text-white">{remainingKcal} kcal</strong></span>
                  <button
                    onClick={() => openAddModal()}
                    className="px-4 py-2 bg-emerald-500 text-slate-950 font-bold rounded-xl hover:bg-emerald-400"
                  >
                    + Προσθήκη Γεύματος
                  </button>
                </div>
              </div>

              {/* Meals List */}
              <div className="space-y-3">
                <h3 className="font-bold text-white text-base">Γεύματα Ημέρας ({meals.length})</h3>
                {meals.length === 0 ? (
                  <div className="p-8 text-center text-slate-500 glass-panel rounded-2xl text-xs">
                    Δεν καταχωρήθηκαν γεύματα για αυτή την ημέρα.
                  </div>
                ) : (
                  meals.map(meal => (
                    <div key={meal.id} className="p-4 bg-slate-950 border border-slate-800 rounded-2xl flex items-center justify-between">
                      <div>
                        <h4 className="font-bold text-white text-sm">{meal.name}</h4>
                        <p className="text-xs text-slate-400">
                          {meal.quantity} • <span className="capitalize text-emerald-400">{meal.category}</span>
                        </p>
                        {(meal.protein > 0 || meal.carbs > 0 || meal.fat > 0) && (
                          <div className="text-[11px] text-slate-300 pt-1">
                            <span className="text-rose-300 font-semibold">P:{meal.protein || 0}g</span> • <span className="text-amber-300 font-semibold">C:{meal.carbs || 0}g</span> • <span className="text-cyan-300 font-semibold">F:{meal.fat || 0}g</span>
                          </div>
                        )}
                      </div>
                      <div className="flex items-center space-x-3">
                        <span className="font-extrabold text-white text-base">{meal.calories} kcal</span>
                        <button onClick={() => openAddModal(meal)} className="text-xs text-cyan-400 hover:underline">Επεξ.</button>
                        <button onClick={() => handleDeleteMeal(meal.id)} className="text-xs text-rose-400 hover:underline">Διαγρ.</button>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}

          {/* Calendar View */}
          {view === 'calendar' && (
            <div className="bg-slate-950 p-6 rounded-3xl border border-slate-800 space-y-4">
              <h3 className="font-bold text-lg text-white">Μηνιαίο Ημερολόγιο ({activeProfile.shortName || activeProfile.name})</h3>
              <p className="text-xs text-slate-400">Επιλέξτε ημερομηνία για να δείτε ή να καταχωρήσετε γεύματα.</p>
              
              <div className="grid grid-cols-7 gap-2 text-center pt-2">
                {['Δευ', 'Τρι', 'Τετ', 'Πεμ', 'Παρ', 'Σαβ', 'Κυρ'].map((d, i) => (
                  <div key={i} className="text-xs font-bold text-slate-500 uppercase">{d}</div>
                ))}
                {Array.from({ length: 31 }, (_, i) => i + 1).map(day => {
                  const dStr = `2026-09-${String(day).padStart(2, '0')}`;
                  const dayMeals = getAllMeals().filter(m => m.date === dStr);
                  const total = dayMeals.reduce((s, m) => s + m.calories, 0);
                  const isOver = total > activeProfile.target;

                  return (
                    <div
                      key={day}
                      onClick={() => {
                        setSelectedDate(dStr);
                        setView('daily');
                      }}
                      className={`p-2 rounded-xl border text-center cursor-pointer transition ${
                        selectedDate === dStr ? 'border-emerald-500 bg-slate-800' : 'border-slate-800 bg-slate-900/60'
                      }`}
                    >
                      <div className="text-xs font-bold text-slate-300">{day}</div>
                      {dayMeals.length > 0 && (
                        <div className={`mt-1 text-[10px] font-bold py-0.5 rounded ${isOver ? 'bg-rose-500/20 text-rose-300' : 'bg-emerald-500/20 text-emerald-300'}`}>
                          {total}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* Add/Edit Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 glass-modal">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-md w-full space-y-4">
                <h3 className="font-bold text-lg text-white">{editingMeal ? 'Επεξεργασία' : 'Προσθήκη'} Γεύματος</h3>
                
                {/* Presets */}
                <div className="text-xs space-y-1">
                  <span className="text-slate-400 font-medium">Έτοιμες επιλογές (με μακροσυστατικά):</span>
                  <div className="flex flex-wrap gap-1 max-h-28 overflow-y-auto p-1.5 bg-slate-950 rounded-xl">
                    {FOOD_PRESETS.map((p, idx) => (
                      <button
                        key={idx}
                        type="button"
                        onClick={() => {
                          setFoodName(p.name);
                          setFoodQty(p.quantity);
                          setFoodKcal(p.calories.toString());
                          setFoodProtein(p.protein.toString());
                          setFoodCarbs(p.carbs.toString());
                          setFoodFat(p.fat.toString());
                          setFoodCat(p.category);
                        }}
                        className="px-2 py-1 bg-slate-800 text-[11px] text-emerald-300 rounded hover:bg-slate-700 text-left"
                      >
                        {p.name} ({p.calories}kcal)
                      </button>
                    ))}
                  </div>
                </div>

                <form onSubmit={handleSaveMeal} className="space-y-3 pt-2">
                  <div>
                    <label className="text-xs text-slate-300 block mb-1">Γεύμα</label>
                    <input
                      type="text"
                      required
                      value={foodName}
                      onChange={(e) => setFoodName(e.target.value)}
                      placeholder="π.χ. Κοτόπουλο με ρύζι"
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-xs text-slate-300 block mb-1">Ποσότητα</label>
                      <input
                        type="text"
                        value={foodQty}
                        onChange={(e) => setFoodQty(e.target.value)}
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white"
                      />
                    </div>
                    <div>
                      <label className="text-xs text-emerald-400 font-bold block mb-1">Θερμίδες (kcal)*</label>
                      <input
                        type="number"
                        required
                        value={foodKcal}
                        onChange={(e) => setFoodKcal(e.target.value)}
                        className="w-full px-3 py-2 bg-slate-950 border border-emerald-500/40 rounded-xl text-sm text-emerald-400 font-bold"
                      />
                    </div>
                  </div>

                  {/* Macronutrients Grid */}
                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="text-[11px] text-rose-400 font-bold block mb-1">Πρωτεΐνη (g)</label>
                      <input
                        type="number"
                        value={foodProtein}
                        onChange={(e) => setFoodProtein(e.target.value)}
                        placeholder="0"
                        className="w-full px-2.5 py-1.5 bg-slate-950 border border-rose-500/40 rounded-xl text-xs text-rose-300 font-bold"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] text-amber-400 font-bold block mb-1">Υδατάνθρ. (g)</label>
                      <input
                        type="number"
                        value={foodCarbs}
                        onChange={(e) => setFoodCarbs(e.target.value)}
                        placeholder="0"
                        className="w-full px-2.5 py-1.5 bg-slate-950 border border-amber-500/40 rounded-xl text-xs text-amber-300 font-bold"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] text-cyan-400 font-bold block mb-1">Λιπαρά (g)</label>
                      <input
                        type="number"
                        value={foodFat}
                        onChange={(e) => setFoodFat(e.target.value)}
                        placeholder="0"
                        className="w-full px-2.5 py-1.5 bg-slate-950 border border-cyan-500/40 rounded-xl text-xs text-cyan-300 font-bold"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-xs text-slate-300 block mb-1">Κατηγορία</label>
                    <select
                      value={foodCat}
                      onChange={(e) => setFoodCat(e.target.value)}
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white"
                    >
                      <option value="breakfast">Πρωινό</option>
                      <option value="lunch">Μεσημεριανό</option>
                      <option value="dinner">Βραδινό</option>
                      <option value="snack">Σνακ</option>
                    </select>
                  </div>

                  <div className="flex space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsModalOpen(false)}
                      className="w-1/2 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-bold"
                    >
                      Ακύρωση
                    </button>
                    <button
                      type="submit"
                      className="w-1/2 py-2 bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs hover:bg-emerald-400"
                    >
                      Αποθήκευση
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Settings Modal */}
          {isSettingsOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 glass-modal">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-lg w-full space-y-5 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <h3 className="font-bold text-lg text-white">⚙️ Ρυθμίσεις & Αλλαγή Προφίλ</h3>
                  <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                {/* Profile Switcher & Target Editor */}
                <div className="space-y-3">
                  <label className="text-xs font-bold text-slate-300 block">Επιλέξτε Ενεργό Προφίλ:</label>
                  
                  <div className="space-y-3">
                    {profiles.map(p => {
                      const isActive = activeProfile.id === p.id;
                      return (
                        <div
                          key={p.id}
                          onClick={() => {
                            setActiveProfileId(p.id);
                            refreshState();
                          }}
                          className={`p-4 rounded-2xl border cursor-pointer transition ${
                            isActive ? 'bg-emerald-950/40 border-emerald-500/60 ring-2 ring-emerald-500/30' : 'bg-slate-950 border-slate-800 hover:bg-slate-800/60'
                          }`}
                        >
                          <div className="flex justify-between items-center mb-2">
                            <span className="font-bold text-sm text-white">{p.name}</span>
                            {isActive && <span className="text-[10px] font-bold text-emerald-400 bg-emerald-500/20 px-2 py-0.5 rounded">✓ ΕΝΕΡΓΟ</span>}
                          </div>

                          <div className="grid grid-cols-4 gap-2 text-xs" onClick={e => e.stopPropagation()}>
                            <div>
                              <span className="text-[10px] text-emerald-400 font-bold block">Kcal</span>
                              <input
                                type="number"
                                value={p.target}
                                onChange={e => {
                                  const val = parseInt(e.target.value, 10) || 0;
                                  const updated = profiles.map(x => x.id === p.id ? { ...x, target: val } : x);
                                  setProfiles(updated);
                                  saveProfiles(updated);
                                  refreshState();
                                }}
                                className="w-full bg-slate-900 border border-slate-700 rounded px-1.5 py-0.5 text-emerald-400 font-bold"
                              />
                            </div>
                            <div>
                              <span className="text-[10px] text-rose-400 font-bold block">P (g)</span>
                              <input
                                type="number"
                                value={p.targetProtein || 0}
                                onChange={e => {
                                  const val = parseInt(e.target.value, 10) || 0;
                                  const updated = profiles.map(x => x.id === p.id ? { ...x, targetProtein: val } : x);
                                  setProfiles(updated);
                                  saveProfiles(updated);
                                  refreshState();
                                }}
                                className="w-full bg-slate-900 border border-slate-700 rounded px-1.5 py-0.5 text-rose-300 font-bold"
                              />
                            </div>
                            <div>
                              <span className="text-[10px] text-amber-400 font-bold block">C (g)</span>
                              <input
                                type="number"
                                value={p.targetCarbs || 0}
                                onChange={e => {
                                  const val = parseInt(e.target.value, 10) || 0;
                                  const updated = profiles.map(x => x.id === p.id ? { ...x, targetCarbs: val } : x);
                                  setProfiles(updated);
                                  saveProfiles(updated);
                                  refreshState();
                                }}
                                className="w-full bg-slate-900 border border-slate-700 rounded px-1.5 py-0.5 text-amber-300 font-bold"
                              />
                            </div>
                            <div>
                              <span className="text-[10px] text-cyan-400 font-bold block">F (g)</span>
                              <input
                                type="number"
                                value={p.targetFat || 0}
                                onChange={e => {
                                  const val = parseInt(e.target.value, 10) || 0;
                                  const updated = profiles.map(x => x.id === p.id ? { ...x, targetFat: val } : x);
                                  setProfiles(updated);
                                  saveProfiles(updated);
                                  refreshState();
                                }}
                                className="w-full bg-slate-900 border border-slate-700 rounded px-1.5 py-0.5 text-cyan-300 font-bold"
                              />
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="pt-3 border-t border-slate-800 text-right">
                  <button
                    onClick={() => setIsSettingsOpen(false)}
                    className="px-5 py-2 bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs hover:bg-emerald-400"
                  >
                    Έτοιμο
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
